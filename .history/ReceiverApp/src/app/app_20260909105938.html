<div class="receiver-container">

  <h1>Machine 2 - Pub/Sub Receiver</h1>

  <div class="uid-box">

    <h2>My Machine 2 UID</h2>

    <p *ngIf="pubsubReceiverService.myUID">
      <strong>{{ pubsubReceiverService.myUID }}</strong>
    </p>

    <p *ngIf="!pubsubReceiverService.myUID">
      Connecting to Pub/Sub...
    </p>

  </div>


  <div class="messages-box">

    <h2>Received Messages</h2>

    <p *ngIf="pubsubReceiverService.receivedMessages.length === 0">
      No messages received yet.
    </p>

    <div
      *ngFor="let message of pubsubReceiverService.receivedMessages"
      class="message"
    >
      {{ message }}
    </div>

  </div>

</div>
