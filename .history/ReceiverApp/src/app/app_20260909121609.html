<div class="receiver-container">

  <h1>Machine 2 - Pub/Sub Receiver</h1>

  <!-- Machine 2 UID -->
  <div class="uid-box">

    <h2>My Machine 2 UID</h2>

    <p *ngIf="pubsubReceiverService.myUID">
      <strong>{{ pubsubReceiverService.myUID }}</strong>
    </p>

    <p *ngIf="!pubsubReceiverService.myUID">
      Connecting to Pub/Sub...
    </p>

  </div>


  <!-- TXT FILE CONTROLS -->
  <div class="file-box">

    <h2>Machine 2 TXT File</h2>

    <button
      type="button"
      (click)="pubsubReceiverService.chooseTxtFile()"
    >
      Select TXT File
    </button>

    <button
      type="button"
      (click)="pubsubReceiverService.deleteAll()"
      style="margin-left: 10px;"
    >
      Delete All
    </button>

    <p *ngIf="pubsubReceiverService.txtStatus">
      <b>Status:</b>
      {{ pubsubReceiverService.txtStatus }}
    </p>

  </div>


  <!-- Received Messages -->
  <div class="messages-box">

    <h2>Received Messages</h2>

    <p *ngIf="pubsubReceiverService.receivedMessages.length === 0">
      No messages received yet.
    </p>

    <div
      *ngIf="pubsubReceiverService.receivedMessages.length > 0"
      class="messages-line"
    >

      <span
        *ngFor="let message of pubsubReceiverService.receivedMessages"
        class="message"
      >
        {{ message }}
      </span>

    </div>

  </div>

</div>
